<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profematerias - Cambiar contraseña</title>

  <!-- Bootstrap 5 (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ===================== BARRA DE NAVEGACIÓN ===================== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="login.html">
        <i class="bi bi-book"></i> Profematerias
      </a>
      <div class="ms-auto d-flex align-items-center">
        <span class="navbar-text me-3" id="usuarioSesion"></span>
        <button class="btn btn-outline-light btn-sm" id="btnSalir">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="zonaMensajes" aria-live="polite"></div>

    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <i class="bi bi-key"></i> Cambiar contraseña
          </div>
          <div class="card-body">

            <div class="alert alert-warning py-2 small" id="avisoPrimerLogin">
              <i class="bi bi-exclamation-triangle"></i>
              Estás usando la contraseña por defecto. Debes cambiarla para
              poder usar la aplicación.
            </div>

            <form id="formPassword" novalidate>

              <div class="mb-3">
                <label for="nuevaPassword" class="form-label">
                  Nueva contraseña *
                </label>
                <input type="password" class="form-control" id="nuevaPassword"
                       minlength="6" required autocomplete="new-password"
                       placeholder="Mínimo 6 caracteres">
                <div class="invalid-feedback">
                  La contraseña debe tener al menos 6 caracteres.
                </div>
              </div>

              <div class="mb-3">
                <label for="repetirPassword" class="form-label">
                  Repite la nueva contraseña *
                </label>
                <input type="password" class="form-control" id="repetirPassword"
                       minlength="6" required autocomplete="new-password">
                <div class="invalid-feedback">
                  Repite la contraseña.
                </div>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success" id="btnGuardarPassword">
                  <i class="bi bi-check-circle"></i> Guardar contraseña
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted small pb-4 mt-4">
    POST <code>/api/auth/password</code> — cifrado BCrypt en la tabla <code>users</code>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/cambiar-password.js"></script>
</body>
</html>
