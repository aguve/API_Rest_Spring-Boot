spring.application.name=profemateria

# Carga las variables desde el archivo .env (formato properties).
# 'optional:' evita fallo si no existe; en ese caso usa variables de entorno del sistema.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
