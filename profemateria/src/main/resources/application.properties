spring.application.name=profemateria

# Carga las variables desde el archivo .env (formato properties).
# 'optional:' evita fallo si no existe; en ese caso usa variables de entorno del sistema.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Spring Security ---------------------------------------------------------
# Usuario administrador único (tabla users). Si no existe ningún ROLE_ADMIN,
# la app lo crea al arrancar con estos valores (bcrypt).
app.seguridad.id-admin=1000
app.seguridad.password-admin=admin1234
# Contraseña por defecto con la que se dan de alta directores y profesores.
app.seguridad.password-por-defecto=1234

# Los mensajes de error (403/400) deben llegar al frontend JSON.
server.error.include-message=always

# Puerto del servidor: configurable desde .env (SERVER_PORT).
# Si no está definido, se usa el 8080 por defecto.
server.port=${SERVER_PORT:8080}
